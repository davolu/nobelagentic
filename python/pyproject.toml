[project]
name = "swarmagents"
version = "0.1.0"
description = "The agent framework that gets out of your way. One kernel, three APIs, any model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
mcp = ["mcp>=1.2"]
all = ["anthropic>=0.40", "openai>=1.50", "mcp>=1.2", "duckduckgo-search>=6.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
swarmagents = "swarmagents.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swarmagents*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
